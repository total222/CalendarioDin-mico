<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"> <!-- Codificación UTF-8 para soportar caracteres especiales -->
  <title>Calendario Multifuncional</title> <!-- Título de la pestaña -->
  <style>
    body {
      font-family: Arial, sans-serif; /* Fuente simple */
      background: #121212;            /* Fondo oscuro */
      color: #f0f0f0;                 /* Texto claro */
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      font-weight: 400;
    }
    #monthName {
      margin-bottom: 20px;
      font-size: 1.5em;
      color: #ffffff;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr); /* 7 columnas para los días */
      gap: 5px;
      width: 90%;
      max-width: 600px;
    }
    .day, .header {
      padding: 10px;
      text-align: center;
      border: 1px solid #444;         /* Bordes oscuros */
      border-radius: 4px;
    }
    .header {
      font-weight: bold;
      background: #1e1e1e;            /* Fondo más oscuro para cabecera */
      color: #f0f0f0;
    }
    .day {
      cursor: pointer;
      background: #2a2a2a;            /* Fondo gris oscuro */
      color: #f0f0f0;
    }
    .day:hover {
      background: #3a3a3a;            /* Cambio al pasar el mouse */
    }
    .controls {
      margin: 10px;
    }
    .controls button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      background: #333;               /* Botones oscuros */
      color: #f0f0f0;
      cursor: pointer;
      transition: background 0.3s;
    }
    .controls button:hover {
      background: #555;               /* Hover más claro */
    }
    #difference {
      margin-top: 20px;
      font-size: 1.2em;
      color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>Calendario Multifuncional</h1> <!-- Título principal -->
  <div id="monthName"></div> <!-- Nombre del mes actual -->
  <div class="controls">
    <button onclick="prevMonth()">◀ Mes anterior</button>
    <button onclick="nextMonth()">Mes siguiente ▶</button>
  </div>
  <div id="calendar" class="calendar"></div>
  <div id="difference"></div> <!-- Texto donde se mostrará la diferencia de días -->

  <script>
    const calendarEl = document.getElementById("calendar"); // Contenedor del calendario
    const monthNameEl = document.getElementById("monthName"); // Elemento para mostrar mes
    const differenceEl = document.getElementById("difference"); // Elemento para mostrar diferencia

    let currentDate = new Date(); // Fecha actual
    let firstSelected = null;     // Primer día seleccionado
    let secondSelected = null;    // Segundo día seleccionado

    // Función para renderizar el calendario
    function renderCalendar() {
      calendarEl.innerHTML = ""; // Limpia el calendario
      const year = currentDate.getFullYear(); // Año actual
      const month = currentDate.getMonth();   // Mes actual
      const firstDay = new Date(year, month, 1).getDay(); // Día de la semana del primer día
      const daysInMonth = new Date(year, month + 1, 0).getDate(); // Número de días en el mes

      // Mostrar nombre del mes y año
      const monthNames = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                          "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      monthNameEl.textContent = `${monthNames[month]} ${year}`;

      // Cabeceras de días
      const headers = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
      headers.forEach(h => {
        const headerEl = document.createElement("div");
        headerEl.className = "header";
        headerEl.textContent = h;
        calendarEl.appendChild(headerEl);
      });

      // Espacios vacíos antes del primer día
      for (let i = 0; i < firstDay; i++) {
        const emptyEl = document.createElement("div");
        calendarEl.appendChild(emptyEl);
      }

      // Días del mes
      for (let day = 1; day <= daysInMonth; day++) {
        const dayEl = document.createElement("div");
        dayEl.className = "day";
        dayEl.textContent = day;
        // Al hacer clic en un día
        dayEl.onclick = () => selectDay(year, month, day);
        calendarEl.appendChild(dayEl);
      }
    }

    // Función para seleccionar días y calcular diferencia
    function selectDay(year, month, day) {
      const selectedDate = new Date(year, month, day); // Fecha seleccionada

      if (!firstSelected) {
        // Si no hay primer día, se guarda este
        firstSelected = selectedDate;
        differenceEl.textContent = `Primer día seleccionado: ${day}/${month+1}/${year}`;
      } else if (!secondSelected) {
        // Si ya hay primer día, este es el segundo
        secondSelected = selectedDate;
        const diffTime = secondSelected - firstSelected; // Diferencia en milisegundos
        const diffDays = Math.abs(diffTime / (1000 * 60 * 60 * 24)); // Convertir a días
        differenceEl.textContent = `Diferencia: ${diffDays} día(s) entre ${firstSelected.getDate()}/${firstSelected.getMonth()+1}/${firstSelected.getFullYear()} y ${secondSelected.getDate()}/${secondSelected.getMonth()+1}/${secondSelected.getFullYear()}`;
      } else {
        // Si ya hay dos días, reinicia el mecanismo
        firstSelected = selectedDate;
        secondSelected = null;
        differenceEl.textContent = `Reinicio: nuevo primer día seleccionado: ${day}/${month+1}/${year}`;
      }
    }

    // Función para ir al mes anterior
    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    // Función para ir al mes siguiente
    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    // Renderizar calendario al inicio
    renderCalendar();
  </script>
</body>
</html>
