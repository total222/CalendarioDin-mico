<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario Multifuncional</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;            /* Fondo oscuro */
      color: #f0f0f0;                 /* Texto claro */
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      font-weight: 400;
    }
    #monthName {
      margin-bottom: 20px;
      font-size: 1.5em;
      color: #ffffff;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      width: 90%;
      max-width: 600px;
    }
    .day, .header {
      padding: 10px;
      text-align: center;
      border: 1px solid #444;         /* Bordes oscuros */
      border-radius: 4px;
    }
    .header {
      font-weight: bold;
      background: #1e1e1e;            /* Fondo más oscuro para cabecera */
      color: #f0f0f0;
    }
    .day {
      cursor: pointer;
      background: #2a2a2a;            /* Fondo gris oscuro */
      color: #f0f0f0;
    }
    .day:hover {
      background: #3a3a3a;            /* Cambio al pasar el mouse */
    }
    .controls {
      margin: 10px;
    }
    .controls button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      background: #333;               /* Botones oscuros */
      color: #f0f0f0;
      cursor: pointer;
      transition: background 0.3s;
    }
    .controls button:hover {
      background: #555;               /* Hover más claro */
    }
  </style>
</head>
<body>
  <h1>Calendario Multifuncional</h1>
  <div id="monthName"></div>
  <div class="controls">
    <button onclick="prevMonth()">◀ Mes anterior</button>
    <button onclick="nextMonth()">Mes siguiente ▶</button>
  </div>
  <div id="calendar" class="calendar"></div>

  <script>
    const calendarEl = document.getElementById("calendar");
    const monthNameEl = document.getElementById("monthName");

    let currentDate = new Date();

    function renderCalendar() {
      calendarEl.innerHTML = "";
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Mostrar nombre del mes
      const monthNames = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                          "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      monthNameEl.textContent = `${monthNames[month]} ${year}`;

      // Cabeceras de días
      const headers = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
      headers.forEach(h => {
        const headerEl = document.createElement("div");
        headerEl.className = "header";
        headerEl.textContent = h;
        calendarEl.appendChild(headerEl);
      });

      // Espacios vacíos antes del primer día
      for (let i = 0; i < firstDay; i++) {
        const emptyEl = document.createElement("div");
        calendarEl.appendChild(emptyEl);
      }

      // Días del mes
      for (let day = 1; day <= daysInMonth; day++) {
        const dayEl = document.createElement("div");
        dayEl.className = "day";
        dayEl.textContent = day;
        calendarEl.appendChild(dayEl);
      }
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
