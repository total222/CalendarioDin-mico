<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Timer Minimalista</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdfdfd;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 20px;
      font-weight: 400;
    }
    #display {
      font-size: 4em;
      margin: 20px 0;
      color: teal;
    }
    .controls button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      background: #eee;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }
    .controls button:hover {
      background: #ddd;
    }
    .settings {
      margin-top: 20px;
    }
    .settings input {
      width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Timer Minimalista</h1>
  <div id="display">00:00</div>
  <div class="controls">
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
  </div>
  <div class="settings">
    <label>Minutos: <input type="number" id="minutes" value="1"></label>
    <label>Segundos: <input type="number" id="seconds" value="0"></label>
    <button onclick="setCustomTime()">Configurar</button>
  </div>

  <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" loop></audio>

  <script>
    let timer;
    let remainingSeconds = 0;
    let isRunning = false;

    function updateDisplay() {
      let min = Math.floor(remainingSeconds / 60);
      let sec = remainingSeconds % 60;
      document.getElementById("display").textContent =
        String(min).padStart(2, '0') + ":" + String(sec).padStart(2, '0');
    }

    function startTimer() {
      if (isRunning || remainingSeconds <= 0) return;
      isRunning = true;
      timer = setInterval(() => {
        remainingSeconds--;
        updateDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(timer);
          document.getElementById("alarmSound").play();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
      document.getElementById("alarmSound").pause();
      document.getElementById("alarmSound").currentTime = 0;
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      remainingSeconds = 0;
      updateDisplay();
      document.getElementById("alarmSound").pause();
      document.getElementById("alarmSound").currentTime = 0;
    }

    function setCustomTime() {
      let min = parseInt(document.getElementById("minutes").value) || 0;
      let sec = parseInt(document.getElementById("seconds").value) || 0;
      remainingSeconds = min * 60 + sec;
      updateDisplay();
    }

    // Inicializar display
    updateDisplay();
  </script>
</body>
</html>
