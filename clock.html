<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"> <!-- Define la codificación de caracteres como UTF-8, soporta acentos y caracteres especiales -->
  <title>Timer</title> <!-- Título de la pestaña del navegador -->
  <style>
    /* Estilos generales del cuerpo */
    body {
      font-family: Arial, sans-serif; /* Fuente simple y clara */
      background: #0a0a0a;            /* Fondo blanco suave */
      color: #ffffff;                    /* Texto gris oscuro */
      display: flex;                  /* Flexbox para centrar contenido */
      flex-direction: column;         /* Elementos en columna */
      align-items: center;            /* Centrado horizontal */
      justify-content: center;        /* Centrado vertical */
      height: 100vh;                  /* Ocupa toda la altura de la ventana */
      margin: 0;                      /* Elimina márgenes por defecto */
    }

    h1 {
      font-weight: 400;               /* Grosor de fuente ligero */
      font-size: 2.5em;                 /* Tamaño grande para el título */
    }

    #display {
      font-size: 10em;                 /* Tamaño grande para el contador */
      margin: 20px 0;                 /* Espaciado arriba y abajo */
      color: teal;                    /* Color llamativo pero minimalista */
    }

    /* Estilo común para botones */
    .controls button, .settings button {
      margin: 5px;
      padding: 20px 40px;
      border: none;
      border-radius: 8px;             /* Bordes redondeados */
      background: #eee;               /* Fondo gris claro */
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;    /* Animación suave al pasar el mouse */
    }

    .controls button:hover, .settings button:hover {
      background: #ddd;               /* Cambio de color al pasar el mouse */
    }

    .settings {
      margin-top: 20px;               /* Espacio superior */
    }

    /* Estilo para los inputs de minutos y segundos */
    .settings input {
      width: 60px;                    /* Ancho fijo */
      text-align: center;             /* Centrar texto */
      margin: 0 5px;                  /* Espaciado lateral */
      padding: 5px;                   /* Espaciado interno */
      border: 1px solid #ccc;         /* Borde gris claro */
      border-radius: 4px;             /* Bordes redondeados */
      font-size: 1em;                 /* Tamaño de texto coherente */
      background: #fafafa;            /* Fondo suave */
    }
    .controls .btn_iniciar {
      background: #4CAF50;            /* Fondo verde para iniciar */
      color: white;                   /* Texto blanco */
    }
    .controls .btn_pausar {
      background: #FF9800;            /* Fondo naranja para pausar */
      color: white;                   /* Texto blanco */
    }
    .controls .btn_reiniciar {
      background: #f44336;            /* Fondo rojo para reiniciar */
      color: white;                   /* Texto blanco */
    }
    .controls .btn_iniciar:hover {
      background: #45a049;            /* Verde más oscuro al pasar el mouse */
    }
    .controls .btn_pausar:hover {
      background: #e68a00;            /* Naranja más oscuro al pasar el mouse */
    }
    .controls .btn_reiniciar:hover {
      background: #d32f2f;            /* Rojo más oscuro al pasar el mouse */
    }
  </style>
</head>
<body>
  <h1>Timer</h1> <!-- Encabezado principal -->
  
  <div id="display">00:00</div> <!-- Contador inicial en pantalla -->
  
  <div class="controls">
    <!-- Botones de control -->
    <button class="btn_iniciar" onclick="startTimer()">Iniciar</button>
    <button class="btn_pausar" onclick="pauseTimer()">Pausar</button>
    <button class="btn_reiniciar" onclick="resetTimer()">Reiniciar</button>
  </div>
  
  <div class="settings">
    <!-- Inputs para personalizar tiempo -->
    <label>Minutos: <input type="number" id="minutes" value="1"></label>
    <label>Segundos: <input type="number" id="seconds" value="0"></label>
  </div>

  <!-- Audio de alarma, se repite en bucle -->
  <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" loop></audio>

  <script>
    let timer;                        // Variable para almacenar el intervalo
    let remainingSeconds = 0;         // Tiempo restante en segundos
    let isRunning = false;            // Estado del temporizador

    // Actualiza el display con el tiempo restante
    function updateDisplay() {
      let min = Math.floor(remainingSeconds / 60); // Calcula minutos
      let sec = remainingSeconds % 60;             // Calcula segundos
      document.getElementById("display").textContent =
        String(min).padStart(2, '0') + ":" + String(sec).padStart(2, '0'); // Formato MM:SS
    }

    // Inicia el temporizador
    function startTimer() {
      if(remainingSeconds <= 0) {
      let min = parseInt(document.getElementById("minutes").value) || 0;
      let sec = parseInt(document.getElementById("seconds").value) || 0;
      remainingSeconds = min * 60 + sec; // Convierte a segundos
      updateDisplay();
      }
    
      if (isRunning || remainingSeconds <= 0) return; // Evita iniciar si ya corre o no hay tiempo
      isRunning = true;
      timer = setInterval(() => {
        remainingSeconds--;        // Resta un segundo
        updateDisplay();           // Actualiza pantalla
        if (remainingSeconds <= 0) {
          clearInterval(timer);    // Detiene el temporizador
          document.getElementById("alarmSound").play(); // Reproduce alarma
        }
      }, 1000); // Cada segundo
    }

    // Pausa el temporizador y detiene alarma
    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
      document.getElementById("alarmSound").pause();
      document.getElementById("alarmSound").currentTime = 0; // Reinicia audio
    }

    // Reinicia el temporizador a cero
    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      remainingSeconds = 0;
      updateDisplay();
      document.getElementById("alarmSound").pause();
      document.getElementById("alarmSound").currentTime = 0;
    }

    // Inicializa display en 00:00
    updateDisplay();
  </script>
</body>
</html>
